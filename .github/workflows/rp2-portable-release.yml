# Builds the headless Linux portable package for a commit on rp2_support and
# publishes it as a GitHub Release. Trigger it by pushing a tag named
# rp2-portable-<12-character commit SHA> that points at that commit:
#   git tag rp2-portable-$(git rev-parse --short=12 HEAD) HEAD
#   git push origin rp2-portable-$(git rev-parse --short=12 HEAD)
name: RP2 portable release

on:
  push:
    tags:
      - 'rp2-portable-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag names a commit on rp2_support
        run: |
          expected="rp2-portable-${GITHUB_SHA:0:12}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match commit $GITHUB_SHA; expected $expected" >&2
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...rp2_support" --jq .status)
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "Commit $GITHUB_SHA is not on rp2_support (compare status: $status)" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake build-essential automake autoconf libtool python3-pip

      - name: Build the portable package
        run: ./build.sh --no-gui -t

      - name: Check the package
        run: |
          shopt -s failglob
          package=(output/packages/renode-*.linux-portable-headless.tar.gz)
          top=$(tar -tzf "${package[0]}" | awk -F/ 'NR == 1 { print $1 }')
          case "$top" in
            renode_*-portable-headless) ;;
            *) echo "Unexpected top-level directory: $top" >&2; exit 1 ;;
          esac
          mkdir check
          tar -xzf "${package[0]}" -C check
          for path in renode platforms/cpus/rp2040.repl platforms/cpus/rp2350.repl \
              scripts/multi-node/metalclaw_fixture.resc \
              scripts/multi-node/extract_pico1_uf2.py \
              scripts/multi-node/extract_rp2040_mask_rom.py; do
            test -e "check/$top/$path" || { echo "Missing $path" >&2; exit 1; }
          done
          "check/$top/renode" --version

      - name: Publish the release
        run: |
          package=$(ls output/packages/renode-*.linux-portable-headless.tar.gz)
          name=$(basename "$package")
          (cd output/packages && sha256sum "$name" > "$name.sha256")
          sha256=$(cut -d' ' -f1 "$package.sha256")
          {
            echo "Headless Linux portable Renode built from rp2_support at $GITHUB_SHA."
            echo
            echo "Submodules:"
            echo '```'
            git submodule status --recursive | grep -E 'src/Infrastructure|tlib'
            echo '```'
            echo
            echo "$name sha256:"
            echo '```'
            echo "$sha256"
            echo '```'
          } > release_notes.md
          gh release create "$GITHUB_REF_NAME" "$package" "$package.sha256" \
            --title "RP2 portable ${GITHUB_SHA:0:12}" \
            --notes-file release_notes.md \
            --verify-tag
